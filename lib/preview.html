<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>启动动画预览 · dsh-startup-kit</title>
<style>
  html,body{height:100%;margin:0;background:#0b0d12;color:#c9d2e3;
    font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
  /* 工具条必须比启动壳（2147483000）更高 */
  #dsk-preview-bar{position:fixed;left:0;right:0;bottom:0;z-index:2147483600;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:10px 16px;background:rgba(10,12,18,.94);
    border-top:1px solid rgba(255,255,255,.09);backdrop-filter:blur(8px)}
  #dsk-preview-bar .tag{letter-spacing:.2em;color:#ff7500;font-size:10px}
  #dsk-preview-bar label{display:flex;align-items:center;gap:8px;color:#8b97ad}
  #dsk-preview-bar select,#dsk-preview-bar button{
    font:inherit;color:#c9d2e3;background:#151a24;border:1px solid rgba(255,255,255,.12);
    padding:5px 10px;cursor:pointer;outline:none}
  #dsk-preview-bar button:hover{border-color:rgba(255,117,0,.6);color:#fff}
  #dsk-preview-bar input[type=range]{width:120px;accent-color:#ff7500}
  #dsk-preview-bar b{color:#e9edf6;font-weight:400;min-width:52px}
  #dsk-preview-bar .msg{color:#6ee7a8;margin-left:auto}
  #dsk-preview-bar .hint{color:#5c667a}
</style>
</head>
<body>

<div id="dsk-preview-bar">
  <span class="tag">PREVIEW</span>
  <label>动画
    <select id="pv-anim"></select>
  </label>
  <label>速度
    <input id="pv-speed" type="range" min="0.25" max="2" step="0.05" value="1">
    <b id="pv-speedv">1.00×</b>
  </label>
  <button id="pv-replay" type="button">重播</button>
  <button id="pv-apply" type="button">设为默认</button>
  <span class="hint">Esc 跳过 · 改动画文件后刷新即可</span>
  <span class="msg" id="pv-msg"></span>
</div>

<script>
(function () {
  'use strict'

  var sel = document.getElementById('pv-anim')
  var speed = document.getElementById('pv-speed')
  var speedv = document.getElementById('pv-speedv')
  var msg = document.getElementById('pv-msg')

  function note(text) {
    msg.textContent = text
    setTimeout(function () {
      if (msg.textContent === text) msg.textContent = ''
    }, 2600)
  }

  function currentSpeed() {
    return Math.min(4, Math.max(0.25, Number(speed.value) || 1))
  }

  /** 起一个新的壳实例。每次都用新 script，避免复用上一轮的闭包状态。 */
  function start(animation) {
    var api = window.__DSH_STARTUP_KIT__
    if (api && typeof api.stop === 'function') {
      try { api.stop() } catch (e) {}
    }

    var old = document.getElementById('dsk-root')
    if (old && old.parentNode) old.parentNode.removeChild(old)

    window.__DSK__ = {
      enabled: true,
      mode: 'always',            // 预览永远播，不看 sessionStorage
      animation: animation,
      speed: currentSpeed(),
      allowSkip: true,
      watchdogMs: 20000,
      panel: 'never'             // 预览页自己有工具条，不需要再叠一个 ⚙
    }
    window.__DSK_SKIP__ = false
    window.__DSK_LOADED__ = false
    window.__DSK_REPLAY__ = true

    var s = document.createElement('script')
    s.src = '/startup-kit/shell.js?t=' + Date.now()
    document.body.appendChild(s)
  }

  function replay() {
    start(sel.value || 'fade')
  }

  speed.addEventListener('input', function () {
    speedv.textContent = currentSpeed().toFixed(2) + '×'
  })

  sel.addEventListener('change', replay)
  document.getElementById('pv-replay').addEventListener('click', replay)

  document.getElementById('pv-apply').addEventListener('click', function () {
    fetch('/startup-kit/config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ animation: sel.value, speed: currentSpeed() })
    })
      .then(function (r) { return r.json() })
      .then(function (d) {
        note(d && d.ok ? '已设为默认：' + d.config.animation : '写入失败')
      })
      .catch(function (e) { note('写入失败：' + e.message) })
  })

  fetch('/startup-kit/config')
    .then(function (r) { return r.json() })
    .then(function (d) {
      var cfg = (d && d.config) || {}
      var list = (d && d.animations) || []
      if (!list.length) {
        note('没有找到任何动画')
        return
      }
      list.forEach(function (a) {
        var opt = document.createElement('option')
        opt.value = a.id
        opt.textContent = a.title + '  (' + a.id + ')'
        if (a.id === cfg.animation) opt.selected = true
        sel.appendChild(opt)
      })
      if (!sel.value) sel.value = list[0].id
      speed.value = cfg.speed || 1
      speedv.textContent = currentSpeed().toFixed(2) + '×'
      start(sel.value)
    })
    .catch(function (e) {
      note('读取配置失败：' + e.message + '（用默认动画起步）')
      start('fade')
    })
})()
</script>
</body>
</html>
